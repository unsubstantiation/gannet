# SPDX-License-Identifier: LicenseRef-GNCL-1.0
name: Windows Release

# Produces the self-contained portable bundle described in BUILD.md and attaches
# it to a GitHub release. The build itself lives in scripts/build_portable.py and
# is reached through scripts/build_portable.ps1, the same command a developer
# runs, so a release cannot be built by a code path nobody tested.
#
# Trigger with a tag (`v0.19.0`) or by hand. A manual run publishes nothing; it
# only uploads the artifact for inspection.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (default: the pyproject.toml version)"
        required: false
        type: string
      publish:
        description: "Also publish a release for an existing tag"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Portable bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A release build needs the tag; nothing here uses a shallow clone's
          # history, but the version fallback reads pyproject.toml only.
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - uses: actions/setup-node@v7
        with:
          # The Windows installation guide asks for Node 22 or newer when the
          # web interface is built from source.
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # pywin32 is only installed into the bundle, not into this environment, so
      # no postinstall step is needed here. If the interpreter digest is not yet
      # recorded in scripts/python_embed_pin.json, this step fails on purpose:
      # a release must verify its inputs rather than trust them.
      - name: Build the bundle
        shell: pwsh
        run: |
          $arguments = @{ RequirePinned = $true }
          if ("${{ inputs.version }}" -ne "") {
            $arguments["Version"] = "${{ inputs.version }}"
          }
          ./scripts/build_portable.ps1 @arguments

      - name: Record what was built
        shell: pwsh
        run: |
          Write-Host "--- dist ---"
          Get-ChildItem dist | Format-Table Name, Length
          Write-Host "--- checksums ---"
          Get-Content dist/SHA256SUMS.txt
          Write-Host "--- bundle listing (top level) ---"
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $archive.Entries |
              Where-Object { $_.FullName.Split('/').Count -eq 2 } |
              ForEach-Object { $_.FullName }
          }
          finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v7
        with:
          name: gannet-nvr-win64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/unsubstantiation.GannetNVR.yaml

      # gh is preinstalled on the runner; using it avoids a third-party action
      # for the one step that needs write access.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ("$tag" -notmatch '^v') {
            Write-Error "Refusing to publish from a ref that is not a v* tag: $tag"
            exit 1
          }

          # Idempotent: re-running a failed release job should attach assets to
          # the existing release instead of failing on "already exists".
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Gannet NVR $tag" `
              --notes-file dist/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          gh release upload $tag `
            --repo $env:GITHUB_REPOSITORY `
            --clobber `
            dist/*.zip dist/*.sha256 dist/SHA256SUMS.txt dist/RELEASE-NOTES.md dist/unsubstantiation.GannetNVR.yaml
          exit $LASTEXITCODE

      - name: Summarize
        if: always()
        shell: pwsh
        run: |
          $summary = "dist/RELEASE-NOTES.md"
          if (Test-Path $summary) {
            Get-Content $summary | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
