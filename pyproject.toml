[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-nvr"
version = "0.19.0"
description = "Native Windows network video recorder with local AI detection"
requires-python = ">=3.12,<3.13"
# Two licenses, deliberately. `LicenseRef-GNCL-1.0` is this fork's own
# noncommercial license for the material it authored (LICENSE, and the paths
# REUSE.toml maps to it); `MIT` is Frigate's, which covers the majority of the tree
# and cannot be narrowed by a fork. A single-license metadata field would mislead
# both humans and scanners, and PEP 639 allows the expression.
license = "LicenseRef-GNCL-1.0 AND MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "LICENSING.md", "THIRD_PARTY.md", "TRADEMARK.md"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
# onnxruntime and onnxruntime-directml both provide the onnxruntime import,
# so this extra replaces the package pinned in requirements.txt instead of
# adding to it. bootstrap_windows.py --directml performs the swap.
windows-directml = ["onnxruntime-directml == 1.24.*"]

[tool.setuptools.packages.find]
include = ["frigate*"]

[tool.setuptools.package-data]
frigate = ["images/*.jpg", "images/*.png"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E711", "E712", "UP031", "UP032", "UP042", "G004"]
extend-select = ["I", "UP", "G", "ASYNC210", "B904"]
