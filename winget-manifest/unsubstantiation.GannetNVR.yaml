# SPDX-License-Identifier: LicenseRef-GNCL-1.0
# Winget manifest TEMPLATE for Gannet NVR. This describes *this fork*, not
# Frigate: the publisher is the person who maintains this repository, and the
# license is not MIT (see LICENSING.md).
#
# Do not submit this file. `scripts/build_portable.py` fills in the tokens below
# (__VERSION__, __URL__, __SHA256__, __BUNDLE_ROOT__) and writes the real
# manifest next to the ZIP it describes; submit that copy, and only after:
#
#     winget validate --manifest <the generated file>
#
# Caveats before the first submission:
#   * The nested installer is python\GannetNVR.exe, a real PE executable. It is
#     a byte-identical copy of the pinned CPython python.exe (upstream's
#     signature, if any, is preserved); the Gannet launcher code it runs is
#     Python source in site-packages and is not signed. Application flags need
#     a -- separator, for example `GannetNVR -- --validate-config`.
#   * ArchiveBinariesDependOnPath is required, not cosmetic. Winget's default
#     portable alias is a symlink in WinGet\Links, and Windows resolves an
#     executable's private DLLs (python312.dll and friends) next to the SYMLINK,
#     not its target, so the interpreter would fail to load. Setting it makes
#     winget put the exe's own directory on PATH instead (no symlink). That also
#     puts the bundled python.exe on PATH; if a submission reviewer objects,
#     move the exe and copies of its DLLs into a dedicated launcher\ directory.
#   * `winget validate` is still a human step, and the manifest is a template
#     until a real release with these bytes exists.
#   * `winget install` must put the extracted folder somewhere writable: the
#     application writes configuration and other data to data\ in its own tree.
#     Verify that winget upgrades preserve that untracked directory before
#     submitting a manifest for a bundle with an existing data directory.
#   * A tag that does not exist yet means the URL 404s. Publish the release
#     first, then submit the manifest that points at it.
PackageIdentifier: unsubstantiation.GannetNVR
PackageVersion: __VERSION__
PackageLocale: en-US
Publisher: unsubstantiation
PublisherUrl: https://fairuniversal.com
PublisherSupportUrl: https://github.com/unsubstantiation/gannet/issues
PackageName: Gannet NVR (Windows)
PackageUrl: https://github.com/unsubstantiation/gannet
License: GNCL-1.0 AND MIT
LicenseUrl: https://raw.githubusercontent.com/unsubstantiation/gannet/dev/LICENSE
ShortDescription: Non-commercial NVR with realtime local object detection for IP cameras, built to run natively on 64-bit Windows.
Copyright: Copyright (c) 2026 unsubstantiation. Portions copyright the Frigate authors, used under the MIT license.
ReleaseNotesUrl: https://github.com/unsubstantiation/gannet/releases
Tags:
  - gannet
  - frigate
  - nvr
  - camera
  - ip-camera
  - object-detection
  - windows
ManifestType: version
ManifestVersion: 1.12.0
Installers:
  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    # The copy of python.exe needs the DLLs beside it; a Links\ symlink would
    # break that. Put the exe's directory on PATH instead.
    ArchiveBinariesDependOnPath: true
    NestedInstallerFiles:
      - RelativeFilePath: __BUNDLE_ROOT__\python\GannetNVR.exe
        PortableCommandAlias: GannetNVR
    InstallerUrl: __URL__
    InstallerSha256: __SHA256__
    Scope: user
    UpgradeBehavior: uninstallPrevious
